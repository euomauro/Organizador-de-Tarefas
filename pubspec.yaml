name: organiza
description: Organiza - organizador de tarefas moderno feito com Flutter, SQLite e Material Design 3.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  http: ^1.2.2
  intl: any
  shared_preferences: ^2.3.3
  fl_chart: '>=0.69.0 <2.0.0'
  table_calendar: ^3.1.2
  cupertino_icons: ^1.0.8
  sqflite_common_ffi_web: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
